name: Unit Test CI

on:
  pull_request:
    branches: [ "main" ] # マージ先となる対象ブランチ

jobs:
  # 💡 この「test-job」という名前を後でGitHubの設定画面で使います
  test-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # プロジェクトのNodeバージョンに合わせて変更してください
        cache: 'npm'       # yarnやpnpmの場合は変更してください

    - name: Install dependencies
      run: npm ci          # yarnなら yarn install --immutable、pnpmなら pnpm i --frozen-lockfile

    - name: Run unit tests
      run: npm test        # package.jsonの "scripts": { "test": "..." } が実行されます
